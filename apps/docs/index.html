<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One system. Different worlds. Explore interactive finance, marketing, social, music, video, and commerce interfaces built with Flux UI React components."
    />
    <link rel="canonical" href="https://flux.varua.ca/" />
    <meta property="og:url" content="https://flux.varua.ca/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Flux UI — One system. Different worlds."
    />
    <meta
      property="og:description"
      content="A pre-stable React design system with lifecycle-aware documentation, accessible components, and measured engineering contracts."
    />
    <script>
      (() => {
        const key = "flux-ui-theme";
        let theme = null;

        try {
          theme = localStorage.getItem(key);
        } catch {
          // Storage can be unavailable without blocking the page.
        }

        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        document.documentElement.dataset.fluxTheme = theme;
        const palettes = new Set([
          "slate",
          "indigo",
          "blue",
          "cyan",
          "teal",
          "emerald",
          "green",
          "lime",
          "amber",
          "orange",
          "rose",
          "violet",
          "fuchsia",
        ]);
        let palette = "indigo";
        try {
          const stored = localStorage.getItem("flux-ui-docs-palette");
          const legacy = localStorage.getItem("flux-ui-docs-accent");
          if (stored && palettes.has(stored)) palette = stored;
          else if (legacy && palettes.has(legacy)) palette = legacy;
        } catch {
          // Palette selection is optional when browser storage is unavailable.
        }
        document.documentElement.dataset.fluxPalette = palette;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%flux-app-icon.svg" />
    <title>Flux UI — One system. Different worlds.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
