name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  attestation:
    name: Local Full Check
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Fetch local full-check attestation
        run: git fetch --no-tags origin refs/notes/flux-full-check:refs/notes/flux-full-check

      - name: Verify local full-check attestation
        run: node tooling/attest/verify.mjs "$GITHUB_SHA" --allow-tree-match

  quality:
    name: Quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Share the internal tasks behind `pnpm flux check`, exposing each gate as a
      # first-class CI step so failures, timings and cancellations are attributable.
      - name: Generated files
        run: node tooling/trust/run-checks.mjs quality generated

      - name: Repository drift
        run: node tooling/trust/run-checks.mjs quality drift

      - name: Docs coverage
        run: node tooling/trust/run-checks.mjs quality docs-coverage

      - name: Dogfood
        run: node tooling/trust/run-checks.mjs quality dogfood

      - name: Format
        run: node tooling/trust/run-checks.mjs quality format

      - name: Package builds
        run: node tooling/trust/run-checks.mjs quality package-build

      - name: ESLint
        run: node tooling/trust/run-checks.mjs quality lint

      - name: TypeScript
        run: node tooling/trust/run-checks.mjs quality types

      - name: Knip
        run: node tooling/trust/run-checks.mjs quality knip

      - name: Workspace tests
        run: node tooling/trust/run-checks.mjs quality workspace-tests

      - name: Size contracts
        run: node tooling/trust/run-checks.mjs quality size-tests

      - name: Icon contracts
        run: node tooling/trust/run-checks.mjs quality icons-tests

      - name: Docs contracts
        run: node tooling/trust/run-checks.mjs quality docs-tests

      - name: Trust, release and terminal contracts
        run: node tooling/trust/run-checks.mjs quality trust-tests

      - name: Dogfood contracts
        run: node tooling/trust/run-checks.mjs quality dogfood-tests

      - name: Safety contracts
        run: node tooling/trust/run-checks.mjs quality safety-tests

      - name: Feature contracts
        run: node tooling/trust/run-checks.mjs quality feature-tests

      - name: Docs production build
        run: node tooling/trust/run-checks.mjs quality docs-build

      - name: Bundle budgets
        run: node tooling/trust/run-checks.mjs quality size

      - name: Coding Bible
        run: node tooling/trust/run-checks.mjs quality coding-bible

      - name: Release bundle budgets
        run: node tooling/trust/run-checks.mjs quality release-size

      - name: Storybook production build
        run: node tooling/trust/run-checks.mjs quality storybook

      - name: No tracked generated drift
        run: node tooling/trust/run-checks.mjs quality clean-tree

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/trust/quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Browser
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @flux-ui/docs run playwright:install:compat

      - name: Run browser checks and record receipts
        run: node tooling/trust/run-checks.mjs browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/trust/browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/docs/test-results
            apps/docs/playwright-report
            .cache/consumer-results
            .cache/consumer-compat-results
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required
    if: always()
    needs: [attestation, quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required jobs passed
        env:
          ATTESTATION_RESULT: ${{ needs.attestation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          TARGET_REF: ${{ github.ref }}
        run: |
          echo "Local full check: $ATTESTATION_RESULT"
          echo "Quality: $QUALITY_RESULT"
          echo "Browser: $BROWSER_RESULT"
          if [ "$TARGET_REF" = "refs/heads/main" ]; then
            test "$ATTESTATION_RESULT" = "skipped"
            test "$QUALITY_RESULT" = "success"
            test "$BROWSER_RESULT" = "success"
          else
            test "$ATTESTATION_RESULT" = "success"
            test "$QUALITY_RESULT" = "skipped"
            test "$BROWSER_RESULT" = "skipped"
          fi

  pages-build:
    name: Pages Build
    if: >-
      !cancelled() &&
      needs.required.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same-run artifacts only. The generator also checks commit, run and attempt.
      - name: Download quality evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/trust/quality/

      - name: Download browser evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/trust/browser/

      - name: Generate fail-closed public evidence
        run: node tooling/trust/generate.mjs --require-ci

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs
        run: node tooling/terminal/tasks.mjs build:docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  pages-deploy:
    name: Pages Deploy
    if: >-
      !cancelled() &&
      needs.pages-build.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
