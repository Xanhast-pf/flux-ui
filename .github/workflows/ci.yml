name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Run quality pipeline
        run: pnpm check

      - name: Verify release size contract
        run: pnpm size:release

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Verify repository stayed clean
        run: git diff --exit-code

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @flux-ui/docs exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: pnpm test:e2e

      - name: Verify runtime performance baseline
        run: pnpm perf

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/docs/test-results
            apps/docs/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required
    if: always()
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required jobs passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Quality: $QUALITY_RESULT"
          echo "Browser: $BROWSER_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
