name: Dependencies
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "13 5 * * 3"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    name: Dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
  audit:
    name: Lockfile audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Audit the complete lockfile, including build/dev dependencies. No lifecycle scripts.
      # Keep failures in the job log instead of persisting an Actions artifact.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
