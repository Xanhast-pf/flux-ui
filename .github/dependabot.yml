version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-tooling:
        patterns:
          - "react*"
          - "@types/react*"
          - "vite*"
          - "vitest*"
      quality-tooling:
        patterns:
          - "eslint*"
          - "prettier"
          - "knip"
          - "@testing-library/*"
          - "@playwright/*"
